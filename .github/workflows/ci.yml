name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

# The tests only read the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # macOS: Apple Silicon (libtorrent 2.1 wheels need macOS 14+; GitHub retired its macos-14 runners).
        # Linux: x86_64 and arm64 (manylinux, so Raspberry Pi 64-bit works too).
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install
        run: |
          uv venv -p ${{ matrix.python }}
          uv pip install -e '.[dev]'
      # Includes tests/test_swarm.py: real libtorrent sessions on 127.0.0.1, no internet.
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Installer syntax
        run: sh -n install.sh
