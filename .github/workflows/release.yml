name: release

# Pushing a tag vX.Y.Z builds that release: the wheel and source archive, and the Docker image for
# amd64 and arm64. It makes a *draft* GitHub release holding them and the image's digest. Nothing is
# signed here: the maintainer runs `flotilla editor release vX.Y.Z` with the project key, which checks
# these files, signs release.json and publishes the release. Until then no install sees it.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # the draft release
  packages: write     # the image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Test
        run: |
          uv venv -p 3.13
          uv pip install -e '.[dev]'
          .venv/bin/python -m pytest -q

      - name: Build the wheel and source archive
        id: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          have=$(.venv/bin/python -c "import flotilla; print(flotilla.__version__)")
          [ "$have" = "$version" ] || { echo "tag $GITHUB_REF_NAME but flotilla/__init__.py says $have"; exit 1; }
          rm -rf dist && uv build
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wheel=$(cd dist && ls *.whl)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: WHEEL=${{ steps.dist.outputs.wheel }}
          push: true
          provenance: false
          tags: |
            ghcr.io/nickmontag/flotilla-face:${{ steps.dist.outputs.version }}
            ghcr.io/nickmontag/flotilla-face:latest

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ghcr.io/nickmontag/flotilla-face@${{ steps.image.outputs.digest }}" > dist/image.txt
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "Flotilla ${{ steps.dist.outputs.version }}" \
            --notes-file notes.md dist/*.whl dist/*.tar.gz dist/image.txt
