<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img">
<title>What makes a piece worth carrying</title>
<desc>Editors score capability, cyber skill and takedown risk into a priority. The swarm probe measures copies, whether the target is reached and whether Hugging Face still has the model into need, and downloaders, seeders and upload speed into demand. Value per GB is priority times need plus demand, weighted by your focus.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; dominant-baseline: central; }
.h { font-size: 14px; font-weight: 600; fill: #1f2328; }
.s { font-size: 12px; fill: #59636e; }
.mid { text-anchor: middle; }
.group { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 3; }
.arr { fill: none; stroke: #8c959f; stroke-width: 1.5; }
.head { stroke: #8c959f; }
.ed rect { fill: #EEEDFE; stroke: #534AB7; } .ed .h { fill: #3C3489; } .ed .s { fill: #534AB7; }
.live rect { fill: #E1F5EE; stroke: #0F6E56; } .live .h { fill: #085041; } .live .s { fill: #0F6E56; }
.out rect { fill: #FAECE7; stroke: #993C1D; } .out .h { fill: #712B13; } .out .s { fill: #993C1D; }
rect { stroke-width: 1; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" class="head" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="h mid" x="135" y="40">How much it matters</text>
<text class="h mid" x="340" y="40">How close to lost</text>
<text class="h mid" x="545" y="40">How many want it</text>
<rect class="group" x="40" y="56" width="190" height="212" rx="12"/>
<rect class="group" x="245" y="56" width="190" height="212" rx="12"/>
<rect class="group" x="450" y="56" width="190" height="212" rx="12"/>

<g class="ed">
  <rect x="50" y="66" width="170" height="56" rx="8"/><text class="h mid" x="135" y="84">Capability</text><text class="s mid" x="135" y="104">weight 0.35</text>
  <rect x="50" y="134" width="170" height="56" rx="8"/><text class="h mid" x="135" y="152">Cyber skill</text><text class="s mid" x="135" y="172">weight 0.25</text>
  <rect x="50" y="202" width="170" height="56" rx="8"/><text class="h mid" x="135" y="220">Takedown risk</text><text class="s mid" x="135" y="240">weight 0.40</text>
</g>
<g class="live">
  <rect x="255" y="66" width="170" height="56" rx="8"/><text class="h mid" x="340" y="84">Copies in the swarm</text><text class="s mid" x="340" y="104">1 ÷ (1 + copies)</text>
  <rect x="255" y="134" width="170" height="56" rx="8"/><text class="h mid" x="340" y="152">Target reached?</text><text class="s mid" x="340" y="172">then worth a tenth</text>
  <rect x="255" y="202" width="170" height="56" rx="8"/><text class="h mid" x="340" y="220">On Hugging Face?</text><text class="s mid" x="340" y="240">×2.5 once it's gone</text>
  <rect x="460" y="66" width="170" height="56" rx="8"/><text class="h mid" x="545" y="84">Downloaders</text><text class="s mid" x="545" y="104">full at 32 or more</text>
  <rect x="460" y="134" width="170" height="56" rx="8"/><text class="h mid" x="545" y="152">Seeders serving</text><text class="s mid" x="545" y="172">shared among them</text>
  <rect x="460" y="202" width="170" height="56" rx="8"/><text class="h mid" x="545" y="220">Your upload</text><text class="s mid" x="545" y="240">full at 100 Mbit/s</text>
</g>

<line class="arr" x1="135" y1="268" x2="135" y2="300" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="268" x2="340" y2="300" marker-end="url(#arrow)"/>
<line class="arr" x1="545" y1="268" x2="545" y2="300" marker-end="url(#arrow)"/>

<g class="ed"><rect x="40" y="302" width="190" height="56" rx="8"/><text class="h mid" x="135" y="320">Priority</text><text class="s mid" x="135" y="340">average × boost, 0 to 1</text></g>
<g class="live">
  <rect x="245" y="302" width="190" height="56" rx="8"/><text class="h mid" x="340" y="320">Need</text><text class="s mid" x="340" y="340">per file, every replan</text>
  <rect x="450" y="302" width="190" height="56" rx="8"/><text class="h mid" x="545" y="320">Demand</text><text class="s mid" x="545" y="340">per file, every replan</text>
</g>

<path class="arr" d="M135 358 L135 384 L260 384 L260 408" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="358" x2="340" y2="408" marker-end="url(#arrow)"/>
<path class="arr" d="M545 358 L545 384 L420 384 L420 408" marker-end="url(#arrow)"/>

<g class="out"><rect x="140" y="410" width="400" height="56" rx="8"/><text class="h mid" x="340" y="428">Value per GB</text><text class="s mid" x="340" y="448">priority × (need + demand), weighted by your focus</text></g>

<g class="ed"><rect x="150" y="494" width="12" height="12" rx="2"/></g><text class="s" x="170" y="500">Scored by editors in the signed list</text>
<g class="live"><rect x="400" y="494" width="12" height="12" rx="2"/></g><text class="s" x="420" y="500">Measured from the swarm</text>
</svg>
